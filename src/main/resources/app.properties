# ============================================================
# 应用运行参数
#
# 这里只放不含密钥的配置。数据库口令等敏感项走环境变量
# （DB_URL / DB_USER / DB_PASSWORD）或本地 db.properties（已被 .gitignore 排除）。
#
# 下面每一项都可以用环境变量覆盖，这样在别的机器上不必改文件就能跑起来。
# ============================================================

# Python 解释器。留空表示使用 PATH 上的 python。
# 环境变量覆盖：PYTHON_EXE
python.executable=

# 爬虫 Python 服务的工作目录。
# 注意：相对路径是相对 JVM 的工作目录解析的，不是相对仓库根。用 Tomcat 部署时
# JVM 的工作目录是 CATALINA_HOME/bin，相对路径必然找不到 crawler 目录，此时要用
# 环境变量 PYTHON_CRAWLER_WORKDIR 给一个指向 crawler 目录的绝对路径。
# 环境变量覆盖：PYTHON_CRAWLER_WORKDIR
python.crawler.workdir=crawler

# Steam/Epic 爬虫微服务的监听端口。Java 侧按同一个值发起调用。
# 环境变量覆盖：CRAWLER_PORT
crawler.port=8099

# 游戏助手（大模型找链接）微服务的监听端口。Java 侧按同一个值发起调用。
# 环境变量覆盖：GAME_FINDER_PORT
game-finder.port=8090