<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GameStream 登录与注册 — 加入我们，探索最新游戏折扣信息">
  <title>登录 / 注册 — GameStream</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--gradient-hero); min-height: 100vh; display: grid; }

    .login-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    /* ── Left Brand Panel ─────────────────────── */
    .brand-panel {
      background: linear-gradient(145deg, rgba(124,58,237,0.15) 0%, rgba(6,182,212,0.08) 100%);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-16);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .brand-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 40%, rgba(124,58,237,0.2) 0%, transparent 70%);
      pointer-events: none;
    }
    .brand-logo {
      font-size: 80px;
      margin-bottom: var(--space-6);
      display: block;
      animation: fadeInUp 0.7s ease both;
      position: relative;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 800;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-4);
      animation: fadeInUp 0.7s 0.1s ease both;
      position: relative;
    }
    .brand-tagline {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.7;
      max-width: 320px;
      animation: fadeInUp 0.7s 0.2s ease both;
      position: relative;
    }
    .brand-features {
      margin-top: var(--space-10);
      text-align: left;
      animation: fadeInUp 0.7s 0.3s ease both;
      position: relative;
    }
    .brand-feature-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .brand-feature-item .check {
      width: 22px;
      height: 22px;
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
    }

    /* ── Right Form Panel ─────────────────────── */
    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-12) var(--space-8);
    }
    .form-box {
      width: 100%;
      max-width: 420px;
      animation: slideIn 0.5s ease both;
    }
    .form-box h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: var(--space-2);
    }
    .form-box .form-subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: var(--space-8);
    }

    /* ── Tabs ────────────────────────────────── */
    .tab-bar {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: var(--space-8);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: calc(var(--radius-md) - 4px);
      cursor: pointer;
      transition: var(--transition-colors), var(--transition-transform);
    }
    .tab-btn.active {
      background: var(--gradient-accent);
      color: #fff;
    }
    .tab-btn:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

    /* ── Form Panel Sections ─────────────────── */
    .auth-form {
      display: none;
      animation: fadeInUp 0.35s ease both;
    }
    .auth-form.active { display: block; }

    .pass-wrapper { position: relative; }
    .pass-wrapper .form-input { padding-right: 48px; }

    /* ── Submit Btn States ───────────────────── */
    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: var(--space-5);
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      transition: var(--transition-transform), var(--transition-shadow);
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .submit-btn:focus-visible { outline: 2px solid var(--accent-secondary); outline-offset: 2px; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: var(--space-6);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: var(--transition-colors);
    }
    .back-link:hover { color: var(--text-primary); }
    .back-link:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 768px) {
      .login-layout { grid-template-columns: 1fr; }
      .brand-panel { display: none; }
      .form-panel { padding: var(--space-8) var(--space-5); }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <div class="login-layout">
    <!-- ── Left Brand Panel ──────────────────── -->
    <div class="brand-panel" aria-hidden="true">
      <span class="brand-logo">🎮</span>
      <div class="brand-title">GameStream</div>
      <p class="brand-tagline">实时同步 Steam、Epic 等平台游戏折扣，AI 助手帮你查价挑好价，一站式游戏优惠平台</p>
      <div class="brand-features">
        <div class="brand-feature-item">
          <span class="check">✓</span>
          <span>实时同步多平台游戏折扣数据</span>
        </div>
        <div class="brand-feature-item">
          <span class="check">✓</span>
          <span>AI 助手按名查价、看榜单、搜口碑</span>
        </div>
        <div class="brand-feature-item">
          <span class="check">✓</span>
          <span>个人收藏夹管理价格动态</span>
        </div>
        <div class="brand-feature-item">
          <span class="check">✓</span>
          <span>支持 Steam 热销榜 & Epic 免费游戏</span>
        </div>
      </div>
    </div>

    <!-- ── Right Form Panel ──────────────────── -->
    <main class="form-panel" id="main-content">
      <div class="form-box">
        <h1>欢迎回来 👋</h1>
        <p class="form-subtitle">登录账号开始探索游戏世界</p>

        <!-- Tab bar -->
        <div class="tab-bar" role="tablist" aria-label="登录与注册切换">
          <button id="tabLogin"    class="tab-btn active" role="tab" aria-selected="true"  aria-controls="loginPanel"    onclick="switchTab('login')">登录</button>
          <button id="tabRegister" class="tab-btn"        role="tab" aria-selected="false" aria-controls="registerPanel" onclick="switchTab('register')">注册</button>
        </div>

        <!-- Global Message -->
        <div id="globalMsg" class="msg-box" aria-live="polite" role="alert"></div>

        <!-- ── Login Form ─────────────────────── -->
        <div id="loginPanel" class="auth-form active" role="tabpanel" aria-labelledby="tabLogin">
          <div class="form-group">
            <label for="loginUsername">用户名</label>
            <div class="input-wrapper">
              <svg class="input-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input class="form-input" type="text" id="loginUsername" name="username"
                     autocomplete="username" aria-label="用户名" placeholder="请输入用户名">
            </div>
          </div>
          <div class="form-group">
            <label for="loginPassword">密码</label>
            <div class="input-wrapper pass-wrapper">
              <svg class="input-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="form-input" type="password" id="loginPassword" name="password"
                     autocomplete="current-password" aria-label="密码" placeholder="请输入密码">
              <button type="button" class="input-icon-right" aria-label="切换密码可见性" onclick="togglePass('loginPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="button" class="submit-btn" id="loginBtn" onclick="handleLogin()">
            <span id="loginBtnText">登录</span>
          </button>
        </div>

        <!-- ── Register Form ──────────────────── -->
        <div id="registerPanel" class="auth-form" role="tabpanel" aria-labelledby="tabRegister">
          <div class="form-group">
            <label for="regUsername">用户名</label>
            <div class="input-wrapper">
              <svg class="input-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input class="form-input" type="text" id="regUsername" name="username"
                     autocomplete="username" aria-label="用户名" placeholder="设置用户名">
            </div>
          </div>
          <div class="form-group">
            <label for="regNickname">昵称</label>
            <div class="input-wrapper">
              <svg class="input-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
              </svg>
              <input class="form-input" type="text" id="regNickname" name="nickname"
                     autocomplete="nickname" aria-label="昵称" placeholder="你的显示昵称">
            </div>
          </div>
          <div class="form-group">
            <label for="regPassword">密码</label>
            <div class="input-wrapper pass-wrapper">
              <svg class="input-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="form-input" type="password" id="regPassword" name="new-password"
                     autocomplete="new-password" aria-label="密码" placeholder="设置密码">
              <button type="button" class="input-icon-right" aria-label="切换密码可见性" onclick="togglePass('regPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="button" class="submit-btn" id="registerBtn" onclick="handleRegister()">
            <span id="registerBtnText">注册账号</span>
          </button>
        </div>

        <a href="index.html" class="back-link">← 返回首页</a>
      </div>
    </main>
  </div>

  <script>
    // ── Tab 切换 ──
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      document.getElementById('tabLogin').setAttribute('aria-selected', isLogin);
      document.getElementById('tabRegister').setAttribute('aria-selected', !isLogin);
      document.getElementById('loginPanel').classList.toggle('active', isLogin);
      document.getElementById('registerPanel').classList.toggle('active', !isLogin);
      document.getElementById('globalMsg').style.display = 'none';
      // 标题联动
      document.querySelector('.form-box h1').textContent = isLogin ? '欢迎回来 👋' : '创建账号 🚀';
      document.querySelector('.form-subtitle').textContent = isLogin
        ? '登录账号开始探索游戏世界'
        : '注册后即可收藏游戏、使用 AI 助手';
    }

    // ── 密码可见切换 ──
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.innerHTML = isText
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
    }

    // ── 消息显示 ──
    function showMsg(text, isSuccess) {
      const el = document.getElementById('globalMsg');
      el.textContent = text;
      el.className = 'msg-box ' + (isSuccess ? 'success' : 'error');
      el.style.display = 'block';
      if (isSuccess) setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    // ── 设置按钮加载状态 ──
    function setBtnLoading(btnId, textId, loading, text) {
      const btn = document.getElementById(btnId);
      const span = document.getElementById(textId);
      btn.disabled = loading;
      if (loading) {
        span.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span>&nbsp;${text}`;
      } else {
        span.textContent = text;
      }
    }

    // ── 登录 ──
    async function handleLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!username || !password) { showMsg('请填写完整信息', false); return; }

      setBtnLoading('loginBtn', 'loginBtnText', true, '登录中…');
      try {
        const response = await fetch(`user?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
        const result = await response.json();
        if (result.status === 'success') {
          localStorage.setItem('currentUser', JSON.stringify(result.data));
          showMsg('登录成功，正在跳转...', true);
          setTimeout(() => {
            window.location.href = username === 'admin' ? 'admin_panel.html' : 'user_home.html';
          }, 900);
        } else {
          showMsg(result.message || '登录失败，请检查用户名或密码', false);
          setBtnLoading('loginBtn', 'loginBtnText', false, '登录');
        }
      } catch (err) {
        console.error(err);
        showMsg('网络错误，请稍后重试', false);
        setBtnLoading('loginBtn', 'loginBtnText', false, '登录');
      }
    }

    // ── 注册 ──
    async function handleRegister() {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const nickname = document.getElementById('regNickname').value.trim();
      if (!username || !password || !nickname) { showMsg('请填写完整信息', false); return; }

      setBtnLoading('registerBtn', 'registerBtnText', true, '注册中…');
      try {
        const response = await fetch(`user?action=register&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&nickname=${encodeURIComponent(nickname)}`);
        const result = await response.json();
        if (result.status === 'success') {
          showMsg('注册成功，请登录', true);
          setTimeout(() => switchTab('login'), 1200);
        } else {
          showMsg(result.message || '注册失败', false);
        }
        setBtnLoading('registerBtn', 'registerBtnText', false, '注册账号');
      } catch (err) {
        console.error(err);
        showMsg('网络错误，请稍后重试', false);
        setBtnLoading('registerBtn', 'registerBtnText', false, '注册账号');
      }
    }

    // ── 已登录检查 ──
    window.addEventListener('DOMContentLoaded', function () {
      const userStr = localStorage.getItem('currentUser');
      if (userStr) {
        const user = JSON.parse(userStr);
        window.location.href = user.username === 'admin' ? 'admin_panel.html' : 'user_home.html';
      }
      // Enter 键提交
      ['loginUsername', 'loginPassword'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
      });
      ['regUsername', 'regNickname', 'regPassword'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
      });
    });
  </script>
</body>
</html>
