<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="管理员面板 — 用户管理与系统维护">
  <title>管理员面板 — GameStream</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; }
    .page-wrapper { max-width: 1400px; margin: 0 auto; padding: var(--space-8) var(--space-6); }

    /* ── Action Bar ──────────────────────────── */
    .action-bar {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin-bottom: var(--space-6);
    }

    /* ── Table Card ──────────────────────────── */
    .table-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    .table-card h2 {
      font-size: 18px;
      font-weight: 700;
      padding: var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--border-glass);
    }
    .table-wrapper { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      position: sticky;
      top: 0;
      background: rgba(7,7,15,0.95);
      padding: var(--space-4) var(--space-5);
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      border-bottom: 1px solid var(--border-glass);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border-glass);
      transition: background-color 0.2s ease;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-surface-hover); }
    tbody td {
      padding: var(--space-4) var(--space-5);
      font-size: 14px;
      color: var(--text-primary);
      vertical-align: middle;
    }
    .user-avatar-cell {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-glass);
    }
    .td-actions {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-colors), var(--transition-transform);
    }
    .icon-btn:hover { transform: scale(1.1); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }
    .icon-btn-edit {
      background: rgba(6,182,212,0.12);
      color: var(--accent-secondary);
    }
    .icon-btn-edit:hover { background: rgba(6,182,212,0.25); }
    .icon-btn-delete {
      background: rgba(239,68,68,0.12);
      color: var(--danger);
    }
    .icon-btn-delete:hover { background: rgba(239,68,68,0.25); }
    .empty-row td { text-align: center; padding: var(--space-16); color: var(--text-muted); }

    /* ── Modal ───────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.is-open { display: flex; }
    .modal-box {
      background: #0f0f1a;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-2xl);
      padding: var(--space-8);
      width: 90%;
      max-width: 520px;
      box-shadow: var(--shadow-lg), 0 0 60px var(--accent-glow);
      animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-footer {
      display: flex;
      gap: var(--space-3);
      justify-content: flex-end;
      margin-top: var(--space-8);
    }

    /* ── Confirm Dialog ──────────────────────── */
    .confirm-box {
      max-width: 380px;
      text-align: center;
    }
    .confirm-box .confirm-icon { font-size: 48px; margin-bottom: var(--space-4); display: block; }
    .confirm-box h3 { font-size: 18px; font-weight: 700; margin-bottom: var(--space-2); }
    .confirm-box p { color: var(--text-secondary); font-size: 14px; margin-bottom: var(--space-6); }
    .confirm-actions { display: flex; gap: var(--space-3); justify-content: center; }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 768px) {
      .action-bar { flex-direction: column; }
      thead th, tbody td { padding: var(--space-3) var(--space-4); font-size: 12px; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <!-- ── Navbar ───────────────────────────────── -->
  <nav class="navbar" role="navigation" aria-label="主导航">
    <a href="index.html" class="navbar-brand">🎮 GameStream</a>
    <div class="navbar-links">
      <a href="index.html">首页</a>
      <a href="crawler_control.html">爬虫控制台</a>
      <button class="btn-danger" style="padding:8px 16px;font-size:13px;" onclick="handleLogout()">退出登录</button>
    </div>
  </nav>

  <main id="main-content">
    <div class="page-wrapper">
      <div id="globalMsg" class="msg-box" aria-live="polite" role="alert"></div>

      <!-- ── Action Bar ─────────────────────── -->
      <div class="action-bar">
        <button class="btn-primary" onclick="showAddUserModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新增用户
        </button>
        <button class="btn-secondary" onclick="loadUsers()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.68"/></svg>
          刷新列表
        </button>
        <a href="crawler_control.html" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8l4 4-4 4"/></svg>
          爬虫控制台
        </a>
      </div>

      <!-- ── User Table ─────────────────────── -->
      <div class="table-card" role="region" aria-label="用户列表">
        <h2>🛠️ 用户管理</h2>
        <div class="table-wrapper">
          <table aria-label="用户列表数据">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">用户名</th>
                <th scope="col">昵称</th>
                <th scope="col">头像</th>
                <th scope="col">状态</th>
                <th scope="col">创建时间</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="userList">
              <tr><td colspan="7" style="text-align:center;padding:60px;color:var(--text-muted);">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- ── User Modal ────────────────────────────── -->
  <div id="userModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">新增用户</h3>
        <button class="modal-close" onclick="closeModal()" aria-label="关闭模态框">&times;</button>
      </div>
      <form id="userForm" novalidate>
        <input type="hidden" id="userId">
        <div class="form-group">
          <label for="modalUsername">用户名 *</label>
          <input type="text" id="modalUsername" class="form-input" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="modalPassword">密码 *</label>
          <input type="password" id="modalPassword" class="form-input" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="modalNickname">昵称 *</label>
          <input type="text" id="modalNickname" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="modalAvatar">头像 URL</label>
          <input type="text" id="modalAvatar" class="form-input" placeholder="可留空">
        </div>
        <div class="form-group">
          <label for="modalStatus">状态</label>
          <select id="modalStatus" class="form-input" style="cursor:pointer;">
            <option value="1">启用</option>
            <option value="0">禁用</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
          <button type="submit" class="btn-primary">保存用户</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Confirm Modal ─────────────────────────── -->
  <div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-box confirm-box">
      <span class="confirm-icon" aria-hidden="true">⚠️</span>
      <h3 id="confirmTitle">确认删除</h3>
      <p id="confirmMsg">确定要删除该用户吗？此操作不可恢复！</p>
      <div class="confirm-actions">
        <button class="btn-secondary" onclick="closeConfirm()">取消</button>
        <button class="btn-danger" id="confirmOkBtn">确认删除</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let pendingDeleteId = null;

    window.addEventListener('DOMContentLoaded', function () {
      const userStr = localStorage.getItem('currentUser');
      if (!userStr) { alert('请先登录'); window.location.href = 'login.html'; return; }
      currentUser = JSON.parse(userStr);
      if (currentUser.username !== 'admin') { alert('无权访问管理员页面'); window.location.href = 'index.html'; return; }
      loadUsers();
    });

    // ESC 关闭
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeModal(); closeConfirm(); }
    });
    // 点击遮罩关闭
    document.getElementById('userModal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
    document.getElementById('confirmModal').addEventListener('click', function (e) { if (e.target === this) closeConfirm(); });

    async function loadUsers() {
      try {
        const res    = await fetch('userManagement?action=getAllUsers&sortType=newest');
        const result = await res.json();
        const tbody  = document.getElementById('userList');

        if (result.status === 'success' && result.data && result.data.length > 0) {
          const fragment = document.createDocumentFragment();
          result.data.forEach(user => {
            const tr = document.createElement('tr');
            const statusBadge = user.status === 1
              ? '<span class="badge badge-success">启用</span>'
              : '<span class="badge badge-danger">禁用</span>';
            const createdAt = user.createdAt ? new Date(user.createdAt).toLocaleString('zh-CN') : '-';

            // id
            const tdId = document.createElement('td');
            tdId.textContent = user.id;
            tr.appendChild(tdId);

            // username
            const tdUser = document.createElement('td');
            tdUser.textContent = user.username || '-';
            tr.appendChild(tdUser);

            // nickname
            const tdNick = document.createElement('td');
            tdNick.textContent = user.nickname || '-';
            tr.appendChild(tdNick);

            // avatar
            const tdAv = document.createElement('td');
            const av = document.createElement('img');
            av.src     = user.avatar || 'assets/imgs/default_avatar.png';
            av.alt     = `${user.nickname || user.username} 头像`;
            av.loading = 'lazy';
            av.className = 'user-avatar-cell';
            av.onerror = function () { this.src = 'assets/imgs/default_avatar.png'; };
            tdAv.appendChild(av);
            tr.appendChild(tdAv);

            // status
            const tdSt = document.createElement('td');
            tdSt.innerHTML = statusBadge;
            tr.appendChild(tdSt);

            // created_at
            const tdCr = document.createElement('td');
            tdCr.textContent = createdAt;
            tr.appendChild(tdCr);

            // actions
            const tdAc = document.createElement('td');
            const actDiv = document.createElement('div');
            actDiv.className = 'td-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'icon-btn icon-btn-edit';
            editBtn.setAttribute('aria-label', `编辑用户 ${user.username}`);
            editBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
            editBtn.addEventListener('click', () => showEditUserModal(user));
            actDiv.appendChild(editBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'icon-btn icon-btn-delete';
            delBtn.setAttribute('aria-label', `删除用户 ${user.username}`);
            delBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
            delBtn.addEventListener('click', () => confirmDelete(user.id, user.username));
            actDiv.appendChild(delBtn);

            tdAc.appendChild(actDiv);
            tr.appendChild(tdAc);
            fragment.appendChild(tr);
          });
          tbody.innerHTML = '';
          tbody.appendChild(fragment);
        } else {
          tbody.innerHTML = '<tr class="empty-row"><td colspan="7">暂无用户数据</td></tr>';
        }
      } catch (err) {
        console.error(err);
        showMsg('加载用户列表失败', false);
      }
    }

    function showAddUserModal() {
      document.getElementById('modalTitle').textContent = '新增用户';
      document.getElementById('userId').value = '';
      document.getElementById('modalUsername').value = '';
      document.getElementById('modalPassword').value = '';
      document.getElementById('modalNickname').value = '';
      document.getElementById('modalAvatar').value = '';
      document.getElementById('modalStatus').value = '1';
      document.getElementById('userModal').classList.add('is-open');
      document.getElementById('modalUsername').focus();
    }
    function showEditUserModal(user) {
      document.getElementById('modalTitle').textContent = '编辑用户';
      document.getElementById('userId').value = user.id;
      document.getElementById('modalUsername').value = user.username || '';
      document.getElementById('modalPassword').value = '';
      document.getElementById('modalNickname').value = user.nickname || '';
      document.getElementById('modalAvatar').value = user.avatar || '';
      document.getElementById('modalStatus').value = user.status != null ? user.status : '1';
      document.getElementById('userModal').classList.add('is-open');
      document.getElementById('modalUsername').focus();
    }
    function closeModal() { document.getElementById('userModal').classList.remove('is-open'); }

    function confirmDelete(userId, username) {
      pendingDeleteId = userId;
      document.getElementById('confirmMsg').textContent = `确定要删除用户 "${username}" 吗？此操作不可恢复！`;
      document.getElementById('confirmModal').classList.add('is-open');
      document.getElementById('confirmOkBtn').focus();
    }
    function closeConfirm() { document.getElementById('confirmModal').classList.remove('is-open'); pendingDeleteId = null; }
    document.getElementById('confirmOkBtn').addEventListener('click', async () => {
      if (!pendingDeleteId) return;
      const id = pendingDeleteId;
      closeConfirm();
      try {
        const res    = await fetch(`userManagement?action=deleteUser&id=${id}`);
        const result = await res.json();
        if (result.status === 'success') { showMsg(result.message, true); loadUsers(); }
        else showMsg(result.message, false);
      } catch (err) { console.error(err); showMsg('删除失败，请稍后重试', false); }
    });

    document.getElementById('userForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const userId   = document.getElementById('userId').value;
      const username = document.getElementById('modalUsername').value;
      const password = document.getElementById('modalPassword').value;
      const nickname = document.getElementById('modalNickname').value;
      const avatar   = document.getElementById('modalAvatar').value;
      const status   = document.getElementById('modalStatus').value;

      let url, params;
      if (userId) {
        url    = 'userManagement?action=updateUser';
        params = new URLSearchParams({ id: userId, username, password, nickname, avatar, status });
      } else {
        url    = 'userManagement?action=addUser';
        params = new URLSearchParams({ username, password, nickname });
      }
      try {
        const res    = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
        const result = await res.json();
        if (result.status === 'success') { showMsg(result.message, true); closeModal(); loadUsers(); }
        else showMsg(result.message, false);
      } catch (err) { console.error(err); showMsg('操作失败，请稍后重试', false); }
    });

    function showMsg(text, isSuccess) {
      const el = document.getElementById('globalMsg');
      el.textContent = text;
      el.className = 'msg-box ' + (isSuccess ? 'success' : 'error');
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }
    function handleLogout() { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; }
  </script>
</body>
</html>
